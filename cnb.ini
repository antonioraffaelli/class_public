# Cosmic Neutrino Background anisotropies
# Cosmological parameters of Table 4.1 of Tesi_Finale.pdf

omega_b = 0.0224
omega_cdm = 0.120
h = 0.6766
A_s = 2.105e-9
n_s = 0.9665
tau_reio = 0.05

# normal ordering, sum(m_nu) = 0.06 eV
N_ur = 0.00441
N_ncdm = 3
m_ncdm = 1.343e-3, 8.7638e-3, 4.9892e-4

output = tCl,cnbCl
l_max_scalars = 200

# CNB settings
# phase-space assumption. 'momentum' is the physical one and the default:
# a decoupled species has f0 frozen as a function of comoving momentum.
# 'energy' is retained only for comparison; see explanatory.ini.
cnb_approach = momentum
# neutrino masses in eV for which the CNB spectrum is computed;
# remove this line to use the m_ncdm values instead
cnb_m_nu = 1.e-5, 1.e-4, 1.e-3, 4.e-3
cnb_z_dec = 6.e9
cnb_q_size = 15

root = output/cnb_
write_background = no
write_thermodynamics = no
input_verbose = 1
perturbations_verbose = 1
background_verbose = 1
transfer_verbose = 1
harmonic_verbose = 1
